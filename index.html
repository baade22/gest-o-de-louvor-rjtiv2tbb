<!-- HTML template for the frontend react app: https://developer.mozilla.org/en-US/docs/Web/HTML --><!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- App web: ao "Adicionar à Tela de Início" no iPhone/Android abre como aplicativo -->
    <link id="app-manifest" rel="manifest" href="/manifest.webmanifest" />
    <!-- Site da igreja (/igreja): o iPhone lê o manifest uma vez, quando a página carrega, e
         ignora a troca feita depois pelo React. Por isso o manifest da igreja já entra aqui
         (mesma URL que siteManifestUrl em src/services/site.ts). -->
    <script>
      (function () {
        try {
          var p = location.pathname
          if (p !== '/igreja' && p.indexOf('/igreja/') !== 0) return
          var q = new URLSearchParams()
          var s = (new URLSearchParams(location.search).get('s') || '').toLowerCase().replace(/[^a-z0-9-]/g, '')
          if (s) q.set('slug', s)
          q.set('origin', location.origin)
          document.getElementById('app-manifest').href =
            '%VITE_POCKETBASE_URL%'.replace(/\/$/, '') + '/backend/v1/public/site/manifest?' + q.toString()
        } catch (e) {}
      })()
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LouvorFlow" />
    <title>LouvorFlow</title>
    <meta
      name="description"
      content="Gestão do ministério de louvor: cultos, escalas, repertório, mídias e integração com o Holyrics."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:title" content="LouvorFlow | Gestão da igreja em um só lugar" />
    <meta
      property="og:description"
      content="Cultos, escalas e repertório integrados ao Holyrics, com mídia, membresia e financeiro da igreja."
    />
  </head>

  <body>
    <div id="root"></div>
    <!-- @skip-protected: Do not remove. Required for app features. -->
    <script src="https://goskip.dev/skip.js"></script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
