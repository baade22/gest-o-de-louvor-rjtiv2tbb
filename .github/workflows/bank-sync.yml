# Conector bancário: busca saldo e extrato na Cora e no Bradesco e entrega ao LouvorFlow.
# Configure os segredos do repositório (Settings > Secrets and variables > Actions):
#   LOUVORFLOW_URL e BANK_SYNC_TOKEN (gerados em Configurações > Integrações > Bancos).
# As credenciais dos bancos vêm do LouvorFlow; os segredos CORA_* e BRADESCO_* são opcionais.
# Só os segredos listados no passo "Buscar saldos e extratos" chegam ao conector; uma credencial
# com sufixo (ex.: CORA_DIAMANTE_*) precisa ganhar a sua linha lá.
# Sem LOUVORFLOW_URL e BANK_SYNC_TOKEN o job termina sem fazer nada. Detalhes em bank-sync/README.md.
name: Conector bancário

on:
  schedule:
    # De 2 em 2 horas, das 7h15 às 21h15 no horário de Brasília
    - cron: '15 10-23/2 * * *'
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bank-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: bank-sync
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Buscar saldos e extratos
        run: node bank-sync/sync.mjs
        env:
          # Cada segredo pelo nome: o conector não recebe os segredos do deploy (chave SSH etc.)
          LOUVORFLOW_URL: ${{ secrets.LOUVORFLOW_URL }}
          BANK_SYNC_TOKEN: ${{ secrets.BANK_SYNC_TOKEN }}
          CORA_CLIENT_ID: ${{ secrets.CORA_CLIENT_ID }}
          CORA_CERT: ${{ secrets.CORA_CERT }}
          CORA_KEY: ${{ secrets.CORA_KEY }}
          BRADESCO_CLIENT_ID: ${{ secrets.BRADESCO_CLIENT_ID }}
          BRADESCO_CLIENT_SECRET: ${{ secrets.BRADESCO_CLIENT_SECRET }}
          BRADESCO_CERT: ${{ secrets.BRADESCO_CERT }}
          BRADESCO_KEY: ${{ secrets.BRADESCO_KEY }}
          BRADESCO_PIX_CLIENT_ID: ${{ secrets.BRADESCO_PIX_CLIENT_ID }}
          BRADESCO_PIX_CLIENT_SECRET: ${{ secrets.BRADESCO_PIX_CLIENT_SECRET }}
